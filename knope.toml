# Knope (https://knope.tech) turns the conventional commits merged into `main` into versioned
# releases, through a pull request you merge when you're ready to ship:
#
# 1. Every push to `main` runs the `prepare-release` workflow below (from
#    .github/workflows/prepare-release.yaml), which keeps a "chore: prepare release x.y.z" pull
#    request open from the `release` branch: `MARKETING_VERSION` bumped in project.yml, and the
#    release's notes added to CHANGELOG.md.
# 2. Merging that pull request runs .github/workflows/release.yaml, which builds, signs, and
#    uploads the apps, then runs the `release` workflow below: it tags the merge commit
#    `vx.y.z` and publishes the GitHub Release, with that CHANGELOG.md section as its notes and
#    the builds attached.
#
# Versions follow Knope's semantic versioning. While the app is 0.x, `feat:` and `fix:` commits
# both bump the last number (0.7.0 → 0.7.1) and only a breaking change — `feat!:`, or a
# `BREAKING CHANGE:` footer — bumps the middle one (0.7.0 → 0.8.0). Other types (`docs:`,
# `refactor:`, `ci:`, …) don't release anything on their own.
# https://knope.tech/reference/concepts/semantic-versioning

[package]
versioned_files = [
    { path = "project.yml", regex = 'MARKETING_VERSION: "(?<version>\d+\.\d+\.\d+)"' },
]
changelog = "CHANGELOG.md"
# release.yaml gathers every build into dist/ before running the `release` workflow. Knope then
# creates the release as a draft, uploads these, and only publishes it once they're all there —
# so the latest release always has the appcast.xml that Sparkle's feed URL points at.
assets = "dist/*"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -c release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release $version\""

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: prepare release $version"

[workflows.steps.body]
template = """
Merging this pull request releases $version: it builds, signs, and uploads the apps (the iOS app to TestFlight), tags the merge commit `v$version`, and publishes a GitHub Release with the notes below. Until then it keeps up to date with everything merged into `main`.

$changelog"""

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"

[github]
owner = "jphastings"
repo = "postcard-collector.app"
